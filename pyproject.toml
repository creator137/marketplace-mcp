[project]
name = "marketplace-mcp"
version = "0.1.0"
description = "Local MCP server for marketplace and freelance platform automation, currently focused on FL.ru."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12.3",
    "httpx>=0.27.0",
    "lxml>=5.2.0",
    "mcp>=1.2.0,<2.0.0",
    "playwright>=1.46.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
marketplace-mcp = "flru_mcp.server.mcp_server:main"
flru-mcp = "flru_mcp.server.mcp_server:main"
flru-scan = "flru_mcp.scan:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flru_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
